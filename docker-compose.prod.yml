# Everything on one VM (e.g. Vultr): docker compose -f docker-compose.prod.yml up -d --build
# Put a reverse proxy with HTTPS (Caddy, nginx) in front of port 3000.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
